stages:
  - build
  - deploy

# ---------- Build Docker images ----------
docker-build:
  stage: build
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    # Build backend e frontend
    - docker build -t "$CI_REGISTRY_IMAGE/backend:latest" Backend/MovieRecommendationSystem
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:latest" Frontend/movie_recommendation_frontend
    # Push
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------- Deploy ----------
deploy:
  stage: deploy
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker pull "$CI_REGISTRY_IMAGE/backend:latest"
    - docker pull "$CI_REGISTRY_IMAGE/frontend:latest"
    - docker compose up -d --build
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'