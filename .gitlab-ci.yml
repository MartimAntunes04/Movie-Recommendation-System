stages:
  - build
  - test
  - deploy

backend-build:
  image: maven:3.9.6-eclipse-temurin-17
  stage: build
  script:
    - cd Backend/MovieRecommendationSystem
    - mvn clean install -DskipTests
  artifacts:
    paths:
      - Backend/MovieRecommendationSystem/target/*.jar
  cache:
    paths:
      - .m2/repository

backend-test:
  image: maven:3.9.6-eclipse-temurin-17
  stage: test
  script:
    - echo "Running backend tests..."
    - cd Backend/MovieRecommendationSystem
    # Executa os testes com logs detalhados e falha o job se algum teste falhar
    - mvn test -B -e
  artifacts:
    when: always  # salva relatórios mesmo se o job falhar
    reports:
      junit: Backend/MovieRecommendationSystem/target/surefire-reports/*.xml
    paths:
      - Backend/MovieRecommendationSystem/target/surefire-reports/
  cache:
    key: maven-cache
    paths:
      - .m2/repository

