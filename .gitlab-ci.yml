# ---------- Stages and Defaults ----------
stages:
  - validate
  - test
  - build
  - package
  - deploy

default:
  before_script:
    - echo "CI Job - $CI_JOB_NAME on $CI_COMMIT_REF_NAME"
  cache:
    key:
      files:
        - Backend/MovieRecommendationSystem/pom.xml
        - Frontend/movie_recommendation_frontend/package-lock.json
    paths:
      - .m2/repository
      - Frontend/movie_recommendation_frontend/node_modules
  
# ---------- Validate ----------
frontend-validate:
  stage: validate
  image: node:20
  script:
    - cd Frontend/movie_recommendation_frontend
    - npm ci
    - npm run lint || true
    - npm run type-check || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Frontend/**/*" ]

backend-validate:
  stage: validate
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/MovieRecommendationSystem
    - mvn -q -DskipTests compile
  artifacts:
    when: on_success
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Backend/**/*" ]

# ---------- Tests ----------
frontend-test:
  stage: test
  image: node:20
  script:
    - cd Frontend/movie_recommendation_frontend
    - npm ci
    - npm test || echo "no tests"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Frontend/**/*" ]
      
backend-test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - cd Backend/MovieRecommendationSystem
    - mvn test -Dtest=!MovieRecommendationSystemApplicationTests
  artifacts:
    when: always
    reports:
      junit: Backend/MovieRecommendationSystem/target/surefire-reports/*.xml
    paths:
      - Backend/MovieRecommendationSystem/target/surefire-reports/
      - Backend/MovieRecommendationSystem/target/site/jacoco/*.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Backend/**/*" ]

# ---------- Build artifacts ----------
backend-build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  needs: [backend-test]
  script:
    - cd Backend/MovieRecommendationSystem
    - mvn -DskipTests package
  artifacts:
    paths:
      - Backend/MovieRecommendationSystem/target/*.jar
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Backend/**/*" ]

frontend-build:
  stage: build
  image: node:20
  needs: [frontend-validate, frontend-test]
  script:
    - cd Frontend/movie_recommendation_frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - Frontend/movie_recommendation_frontend/.next
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   # run on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'                    # run on main
    - changes: [ "Frontend/**/*" ]

# ---------- Package Docker images ----------
docker-build:
  stage: package
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  needs: [backend-build, frontend-build]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" Backend/MovieRecommendationSystem
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" Frontend/movie_recommendation_frontend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------- Deploy ----------
deploy:
  stage: deploy
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs: [docker-build]
  script:
    # Use images from registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker pull "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" || true
    - docker pull "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" || true
    # Fallback to compose build (dev)
    - docker compose up -d --build
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ---------- Security Scans ----------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # speed up by skipping generated dirs
  SAST_EXCLUDED_FILE_PATHS: "Frontend/movie_recommendation_frontend/node_modules,Frontend/movie_recommendation_frontend/.next,Backend/MovieRecommendationSystem/target"

sast:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

secret_detection:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'